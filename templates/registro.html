{% extends "base.html" %}
{% block title %}Registro de investigador | Comité de Investigación{% endblock %}
{% block content %}
<section class="login-card wide">
  <h1>Registro de investigador</h1>
  <p class="text-muted mt-0 mb-6">Cree su cuenta para radicar solicitudes ante el Comité de Investigación.</p>
  <form method="post" class="form-grid">
    <div class="full">
      <label for="nombre">Nombre completo *</label>
      <input id="nombre" name="nombre" minlength="3" value="{{ request.form.get('nombre', '') }}" required>
    </div>
    <div>
      <label for="documento">Documento de identidad *</label>
      <input id="documento" name="documento" pattern="[0-9A-Za-z]{5,15}" data-msg="Use de 5 a 15 letras o números, sin puntos ni espacios." value="{{ request.form.get('documento', '') }}" required>
    </div>
    <div>
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" pattern="[0-9+ ]{7,15}" data-msg="Escriba un teléfono de 7 a 15 dígitos." value="{{ request.form.get('telefono', '') }}">
    </div>
    <div>
      <label for="facultad">Facultad</label>
      <input id="facultad" name="facultad" value="{{ request.form.get('facultad', '') }}">
    </div>
    <div>
      <label for="programa">Programa / grupo de investigación</label>
      <input id="programa" name="programa" value="{{ request.form.get('programa', '') }}">
    </div>
    <div class="full">
      <label for="correo">Correo institucional *</label>
      <input id="correo" name="correo" type="email" value="{{ request.form.get('correo', '') }}" autocomplete="username" required>
    </div>
    <div>
      <label for="password">Contraseña * <small class="text-muted">(mín. 6 caracteres)</small></label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
    </div>
    <div>
      <label for="password2">Confirmar contraseña *</label>
      <input id="password2" name="password2" type="password" minlength="6" data-match="password" autocomplete="new-password" required>
    </div>
    <div class="full flex justify-end gap-2.5 mt-5">
      <a class="button button-secondary" href="{{ url_for('login') }}">Volver</a>
      <button class="button button-primary" type="submit">Registrarme</button>
    </div>
  </form>
</section>
{% endblock %}
